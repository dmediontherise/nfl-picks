name: Snapshot NFL Rosters and Injuries

'on':
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch roster snapshot
        run: npm run snapshot:roster

      - name: Commit and push if snapshot changed
        run: |
          if git diff --quiet src/data/rosterSnapshot.json; then
            echo "No roster snapshot changes detected. Skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/rosterSnapshot.json
            git commit -m "chore(data): update roster snapshot [skip ci]"
            git push
          fi
