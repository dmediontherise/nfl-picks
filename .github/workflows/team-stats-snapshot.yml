name: Snapshot NFL Team Stats and Scheme Tendencies

'on':
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch team stats snapshot
        run: npm run snapshot:teamstats

      - name: Commit and push if snapshot changed
        run: |
          if git diff --quiet src/data/teamStats.json; then
            echo "No team stats snapshot changes detected. Skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/teamStats.json
            git commit -m "chore(data): update team stats snapshot [skip ci]"
            git push
          fi
